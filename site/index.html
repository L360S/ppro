<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC BALL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP BAR AND HOME BUTTON -->
    <header class="top-bar">

        <div class="top-bar-left">

            <a href="index.html" class="logo">
                UFC <span class="accent">BALL</span>
            </a>

            <span class="nav-divider"></span>

            <span class="brand-tagline">
                KNOW <span>•</span> ROLL <span>•</span> WIN
            </span>

        </div>


        <div class="top-bar-right">

            <span class="red-divider"></span>

            <span class="game-tagline">
                <!--tagline right top header-->
            </span>

        </div>

    </header>

    <!-- PAGE BODY -->
    <main class="page-container">
        
        <a href="buildafighter.html" class="card">
            <img src="images/buildafighter1.png" class="card-bg-image" alt="Build A Fighter">
            <div class="card-content">
                <h2 class="card-title">Build A Fighter</h2>
                <p>Create the best fighter possible.</p>
            </div>
        </a>

        <a href="#" class="card">
            <img src="images/buildateam1.png" class="card-bg-image" alt="Team Brawl">
            <div class="card-content">
                <h2 class="card-title">Team Brawl <span class="accent">(WIP)</span></h2>
                <p>Assemble a team of fighters.</p>
            </div>
        </a>

        <a href="#" class="card">
            <img src="images/mmadle1.png" class="card-bg-image" alt="MMAdle">
            <div class="card-content">
                <h2 class="card-title">MMAdle <span class="accent">(WIP)</span></h2>
                <p>Guess the fighter with limited information.</p>
            </div>
        </a>

    </main>

</body>
</html>
